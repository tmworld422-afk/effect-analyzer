<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エフェクト推薦システム</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #eff6ff 100%);
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 32px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 28px;
            color: #1f2937;
        }
        .info-box {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 32px;
        }
        .info-box p {
            color: #1e40af;
            font-size: 14px;
            line-height: 1.6;
        }
        .factor-card {
            border: 2px solid;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .factor-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .factor-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        .factor-info {
            flex: 1;
        }
        .factor-title {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
        }
        .factor-desc {
            font-size: 14px;
            color: #6b7280;
        }
        .factor-value {
            font-size: 32px;
            font-weight: bold;
            margin-left: auto;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            background: #e5e7eb;
        }
        input[type="range"]::-webkit-slider-track {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -7px;
        }
        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            border: none;
        }
        input[type="range"]::-ms-track {
            width: 100%;
            height: 6px;
            background: transparent;
            border-color: transparent;
            color: transparent;
        }
        input[type="range"]::-ms-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
        }
        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #6b7280;
        }
        .recommend-btn {
            width: 100%;
            background: linear-gradient(90deg, #9333ea 0%, #2563eb 100%);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .recommend-btn:hover {
            background: linear-gradient(90deg, #7e22ce 0%, #1d4ed8 100%);
            transform: translateY(-2px);
        }
        .results {
            margin-top: 32px;
        }
        .results-header {
            background: linear-gradient(90deg, #f3e8ff 0%, #dbeafe 100%);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .results-header h2 {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .effect-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            transition: border-color 0.3s;
        }
        .effect-card:hover {
            border-color: #a78bfa;
        }
        .effect-content {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 24px;
        }
        .effect-image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .effect-image {
            width: 192px;
            height: 192px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid #d1d5db;
            object-fit: cover;
        }
        .rank-badge {
            margin-top: 12px;
            font-size: 24px;
            font-weight: bold;
            color: #9333ea;
        }
        .effect-info {
            flex: 1;
        }
        .effect-header-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .effect-name {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .effect-category {
            display: inline-block;
            background: #f3f4f6;
            color: #6b7280;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .effect-desc {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .factor-scores {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .factor-badge {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        .similarity-box {
            text-align: right;
        }
        .similarity-label {
            font-size: 14px;
            color: #6b7280;
        }
        .similarity-value {
            font-size: 32px;
            font-weight: bold;
            color: #9333ea;
        }
        .chart-container {
            margin-top: 16px;
            height: 300px;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 768px) {
            .effect-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        <div class="info-box">

    <script>

            { id: 6, name: 'スプラッシュ(赤)', category: 'スプラッシュ', description: 'エネルギッシュな赤の粒子', imageNum: 6, factorScores: { F1: 1.317, F2: 0.445, F3: -0.816 } },
            { id: 7, name: 'スプラッシュ(緑)', category: 'スプラッシュ', description: 'ダイナミックな緑の粒子', imageNum: 7, factorScores: { F1: -0.871, F2: -1.894, F3: 0.298 } },
            { id: 8, name: 'スプラッシュ(青)', category: 'スプラッシュ', description: '涼しげな青の粒子', imageNum: 8, factorScores: { F1: 0.848, F2: -0.700, F3: 1.244 } },
            { id: 9, name: '炎(元の色)', category: '炎', description: '燃え上がる炎（元の色）', imageNum: 9, factorScores: { F1: -0.726, F2: 0.631, F3: -1.596 } },
            { id: 10, name: '炎(赤)', category: '炎', description: '情熱的な赤い炎', imageNum: 10, factorScores: { F1: 0.603, F2: 1.302, F3: -1.097 } },
            { id: 11, name: '炎(緑)', category: '炎', description: '神秘的な緑の炎', imageNum: 11, factorScores: { F1: -0.313, F2: -0.665, F3: 0.139 } },
            { id: 12, name: '炎(青)', category: '炎', description: 'クールな青い炎', imageNum: 12, factorScores: { F1: -0.099, F2: 1.090, F3: 1.592 } },
            { id: 13, name: '水流(元の色)', category: '水流', description: '流れる水（元の色）', imageNum: 13, factorScores: { F1: -2.253, F2: 0.039, F3: 0.878 } },
            { id: 14, name: '水流(赤)', category: '水流', description: '鮮やかな赤の水流', imageNum: 14, factorScores: { F1: 0.758, F2: 1.015, F3: -0.411 } },
            { id: 15, name: '水流(緑)', category: '水流', description: '自然な緑の水流', imageNum: 15, factorScores: { F1: -0.727, F2: -0.219, F3: -0.050 } },
            { id: 16, name: '水流(青)', category: '水流', description: '涼やかな青の水流', imageNum: 16, factorScores: { F1: -0.982, F2: 0.737, F3: 1.105 } },
            { id: 17, name: 'ハートグロー(元の色)', category: 'ハートグロー', description: '柔らかな光（元の色）', imageNum: 17, factorScores: { F1: -0.992, F2: -1.184, F3: -0.592 } },
            { id: 18, name: 'ハートグロー(赤)', category: 'ハートグロー', description: '情熱的な赤の光', imageNum: 18, factorScores: { F1: 0.899, F2: -1.183, F3: -1.416 } },
            { id: 19, name: 'ハートグロー(緑)', category: 'ハートグロー', description: '優しい緑の光', imageNum: 19, factorScores: { F1: -0.105, F2: -2.017, F3: -0.420 } },
            { id: 20, name: 'ハートグロー(青)', category: 'ハートグロー', description: '幻想的な青の光', imageNum: 20, factorScores: { F1: 2.036, F2: -0.785, F3: 1.053 } }

        // ========================================
        // ⭐⭐⭐ ここを編集: 画像パス ⭐⭐⭐

        // ========================================
        
        // ローカル使用の場合はこちらを使用（コメントを外す）

            20: './image_20.png'
        };
        
        
        // プレースホルダー（テスト用）- ローカルで使う場合はこの部分をコメントアウト
        /*
        const imageData = {
            1: 'https://via.placeholder.com/192x192/FFD700/ffffff?text=1',
            2: 'https://via.placeholder.com/192x192/FF6B6B/ffffff?text=2',
            3: 'https://via.placeholder.com/192x192/51CF66/ffffff?text=3',

            7: 'https://via.placeholder.com/192x192/51CF66/ffffff?text=7',
            8: 'https://via.placeholder.com/192x192/4DABF7/ffffff?text=8',
            9: 'https://via.placeholder.com/192x192/FF6B35/ffffff?text=9',
            10: 'https://via.placeholder.com/192x192/FF0000/ffffff?text=10',
            11: 'https://via.placeholder.com/192x192/00FF00/ffffff?text=11',

            14: 'https://via.placeholder.com/192x192/FFC2D1/ffffff?text=14',
            15: 'https://via.placeholder.com/192x192/51CF66/ffffff?text=15',

        };
*/
        // ========================================
        // 因子スライダーの初期化
        // ========================================
        function initializeFactors() {
            const container = document.getElementById('factors');
            Object.entries(factors).forEach(([key, factor]) => {
                const card = document.createElement('div');
                card.className = 'factor-card';
                card.style.borderColor = factor.color + '40';
                card.style.backgroundColor = factor.color + '08';
                
                card.innerHTML = `
                    <div class="factor-header">
                        <div class="factor-dot" style="background-color: ${factor.color}"></div>
                        <div class="factor-info">
                            <div class="factor-title">${key}: ${factor.name}</div>
                            <div class="factor-desc">${factor.description}</div>
                        </div>
                        <div class="factor-value" style="color: ${factor.color}" id="value-${key}">0.0</div>
                    </div>
                    <input type="range" min="-3" max="3" step="0.1" value="0" 
                           style="color: ${factor.color}" 
                           oninput="updateFactor('${key}', this.value)">
                    <div class="range-labels">
                        <span>-3</span>
                        <span>0</span>
                        <span>+3</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateFactor(key, value) {
            factorScores[key] = parseFloat(value);
            document.getElementById(`value-${key}`).textContent = parseFloat(value).toFixed(1);
        }

        // ========================================
        // 印象スコア計算
        // ========================================
        function calculateImpressionScores(factors) {
            const impressions = {};
            Object.keys(factorLoadings).forEach(key => {
                const loading = factorLoadings[key];
                impressions[key] = 
                    factors.F1 * loading.F1 +
                    factors.F2 * loading.F2 +
                    factors.F3 * loading.F3;
            });
            return impressions;
        }

        // ========================================
        // 類似度計算
        // ========================================
        function calculateSimilarity(userFactors, effectFactors) {
            const userImpressions = calculateImpressionScores(userFactors);
            const effectImpressions = calculateImpressionScores(effectFactors);
            
            let sumSquaredDiff = 0;
            Object.keys(userImpressions).forEach(key => {
                const diff = userImpressions[key] - effectImpressions[key];
                sumSquaredDiff += diff * diff;
            });
            
            const distance = Math.sqrt(sumSquaredDiff);
            const similarity = 1 / (1 + distance);
            
            return { similarity, userImpressions, effectImpressions };
        }

        // ========================================
        // 推薦処理
        // ========================================
        function handleRecommend() {
            const results = effects.map(effect => {
                const { similarity, userImpressions, effectImpressions } = 
                    calculateSimilarity(factorScores, effect.factorScores);
                
                return { ...effect, similarity, userImpressions, effectImpressions };
            });

            results.sort((a, b) => b.similarity - a.similarity);
            displayResults(results);
        }

        // ========================================
        // 結果表示
        // ========================================
        function displayResults(results) {
            const container = document.getElementById('results');
            container.classList.remove('hidden');
            
            let html = `
                <div class="results-header">
                    <h2>推薦結果</h2>
                    <p style="font-size: 14px; color: #6b7280; margin-top: 4px;">
                        入力された因子得点から逆算された印象に最も近いエフェクト
                    </p>
                </div>
            `;

            results.forEach((effect, index) => {
                html += `
                    <div class="effect-card">
                        <div class="effect-content">
                            <div class="effect-image-container">
                                <img src="${imageData[effect.imageNum]}" 
                                     alt="${effect.name}" class="effect-image">
                                <div class="rank-badge">#${index + 1}</div>
                            </div>
                            <div class="effect-info">
                                <div class="effect-header-row">
                                    <div style="flex: 1;">
                                        <div class="effect-name">${effect.name}</div>
                                        <div class="effect-category">${effect.category}</div>
                                        <div class="effect-desc">${effect.description}</div>
                                        <div class="factor-scores">
                                            ${Object.entries(effect.factorScores).map(([key, score]) => `
                                                <div class="factor-badge" style="background-color: ${factors[key].color}20; color: ${factors[key].color}">
                                                    <strong>${key}:</strong> ${score.toFixed(1)}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                    <div class="similarity-box">
                                        <div class="similarity-label">適合度</div>
                                        <div class="similarity-value">${(effect.similarity * 100).toFixed(0)}%</div>
                                    </div>
                                </div>
                                <div class="chart-container">
                                    <canvas id="chart-${effect.id}"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // チャートを描画
            results.forEach(effect => {
                createRadarChart(effect);
            });
        }

        // ========================================
        // レーダーチャート作成
        // ========================================
        function createRadarChart(effect) {
            const ctx = document.getElementById(`chart-${effect.id}`);
            const labels = Object.keys(factorLoadings).slice(0, 8).map(key => 
                factorLoadings[key].label.split(' - ')[0]
            );
            
            const userData = Object.keys(factorLoadings).slice(0, 8).map(key => 
                (effect.userImpressions[key] + 3) / 6 * 100
            );
            
            const effectData = Object.keys(factorLoadings).slice(0, 8).map(key => 
                (effect.effectImpressions[key] + 3) / 6 * 100
            );

            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'あなたの入力',
                            data: userData,
                            backgroundColor: 'rgba(139, 92, 246, 0.2)',
                            borderColor: 'rgba(139, 92, 246, 1)',
                            borderWidth: 2
                        },
                        {
                            label: 'このエフェクト',
                            data: effectData,
                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                stepSize: 20
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        }

        // ========================================
        // 初期化
        // ========================================
        initializeFactors();
    </script>
</body>
</html>
